[project]
name = "sentinel"
version = "0.6.2"
description = "Real-time network intrusion detection with rule-based and ML anomaly detection"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

[project.urls]
Repository = "https://github.com/smngvlkz/sentinel"
Issues = "https://github.com/smngvlkz/sentinel/issues"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
