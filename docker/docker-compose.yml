# Every port is bound to 127.0.0.1: the API has no authentication, so the
# dashboard is only reachable from this machine. See README "Remote access".

x-db-env: &db-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-sentinel_ai}
  POSTGRES_USER: ${POSTGRES_USER:-sentinel}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}

services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_ai}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  analyzer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.analyzer
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *db-env
      REDIS_HOST: redis
      ALERT_COOLDOWN_SECONDS: ${ALERT_COOLDOWN_SECONDS:-}
      # Overrides [names] enabled in detection.toml; `make demo` sets it.
      NAMES_ENABLED: ${NAMES_ENABLED:-}
    volumes:
      - ../ml-models/saved:/app/ml-models/saved:ro
      - ../config:/app/config:ro
    restart: unless-stopped

  dashboard-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *db-env
      REDIS_HOST: redis
      # 3000 is the dashboard dev server (make dashboard-dev).
      CORS_ORIGINS: http://localhost:${DASHBOARD_UI_PORT:-3001},http://127.0.0.1:${DASHBOARD_UI_PORT:-3001},http://localhost:3000
    restart: unless-stopped

  dashboard-ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard-ui
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${DASHBOARD_PORT:-8000}
    ports:
      - "127.0.0.1:${DASHBOARD_UI_PORT:-3001}:3000"
    depends_on:
      - dashboard-api
    restart: unless-stopped

  # Fake attack traffic for trying SentinelAI without packet capture.
  # Started only by `make demo` (docker compose --profile demo up).
  simulator:
    profiles: ["demo"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.analyzer
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
    command: ["python", "scripts/simulate_attack.py"]
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
