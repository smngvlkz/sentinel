# Every port is bound to 127.0.0.1, so only this machine can reach them,
# except the dashboard's and ntfy's when DASHBOARD_BIND says otherwise (README
# "Opening the dashboard from other devices"). The API won't start that way until a
# password is set. The API's own port always stays on this machine: the
# dashboard reaches it inside Docker.

x-db-env: &db-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-sentinel_ai}
  POSTGRES_USER: ${POSTGRES_USER:-sentinel}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}

services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_ai}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  analyzer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.analyzer
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *db-env
      REDIS_HOST: redis
      ALERT_COOLDOWN_SECONDS: ${ALERT_COOLDOWN_SECONDS:-}
      # Overrides [names] enabled in detection.toml; `make demo` sets it.
      NAMES_ENABLED: ${NAMES_ENABLED:-}
    volumes:
      - ../ml-models/saved:/app/ml-models/saved:ro
      - ../config:/app/config:ro
    restart: unless-stopped

  dashboard-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *db-env
      REDIS_HOST: redis
      # Tells the API whether other devices can reach the dashboard.
      DASHBOARD_BIND: ${DASHBOARD_BIND:-127.0.0.1}
      # 3000 is the dashboard dev server (make dashboard-dev).
      CORS_ORIGINS: http://localhost:${DASHBOARD_UI_PORT:-3001},http://127.0.0.1:${DASHBOARD_UI_PORT:-3001},http://localhost:3000
    restart: unless-stopped

  dashboard-ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard-ui
      args:
        API_INTERNAL_URL: http://dashboard-api:8000
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_UI_PORT:-3001}:3000"
    depends_on:
      - dashboard-api
    restart: unless-stopped

  # Sends alerts to your phone, email or chat (config/notifications.toml).
  # Sends nothing until notifications are turned on there.
  notifier:
    build:
      context: ..
      dockerfile: docker/Dockerfile.notifier
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *db-env
      REDIS_HOST: redis
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
    volumes:
      - ../config:/app/config:ro
    restart: unless-stopped

  # Your own ntfy server, for phone notifications that stay on this machine.
  # Started when COMPOSE_PROFILES=ntfy is in .env (make notify-setup adds it).
  # Its port is open to the same devices as the dashboard (DASHBOARD_BIND),
  # because your phone has to reach it, so it's locked down: everything is
  # refused except reading your topic (NTFY_TOPIC, a random name) and the
  # notifier posting to it with its token (NTFY_TOKEN). For iPhones, ntfy.sh
  # only relays a "new message" wake-up; the alert text is fetched from here.
  ntfy:
    profiles: ["ntfy"]
    image: binwiederhier/ntfy:v2.31.0
    command: serve
    environment:
      # The address your phone uses for this server, e.g. http://100.101.102.103:8090.
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://localhost:8090}
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: 24h
      NTFY_WEB_ROOT: disable
      NTFY_AUTH_FILE: /var/cache/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      # The notifier's account. The hash is of a random password that was
      # thrown away: nobody can log in as it, the notifier uses NTFY_TOKEN.
      NTFY_AUTH_USERS: "sentinel-notifier:$$2a$$10$$9U2rfv1UdLdfg9SwMoUkd.O6Ha5z6cG6fZZdXPbPgdl0DOebfIpQq:user"
      NTFY_AUTH_TOKENS: "sentinel-notifier:${NTFY_TOKEN:-}:SentinelAI notifier"
      NTFY_AUTH_ACCESS: "*:${NTFY_TOPIC:-}:read-only,sentinel-notifier:${NTFY_TOPIC:-}:write-only"
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:${NTFY_PORT:-8090}:80"
    volumes:
      - ntfy_cache:/var/cache/ntfy
    restart: unless-stopped

  # Fake attack traffic for trying SentinelAI without packet capture.
  # Started only by `make demo` (docker compose --profile demo up).
  simulator:
    profiles: ["demo"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.analyzer
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
    command: ["python", "scripts/simulate_attack.py"]
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  ntfy_cache:
