# SentinelAI detection thresholds.
#
# The defaults are tuned conservatively for a home or small-office network.
# Busy networks (file servers, streaming boxes) may need higher rate limits
# to avoid noise. Restart the analyzer after editing:
#
#     make restart
#
# Point SENTINEL_CONFIG at another file to keep your own copy outside the repo.

[syn_flood]
# Fraction of a flow's packets that are bare SYNs (connection attempts).
min_syn_ratio = 0.8
# Packets per second within the flow.
min_packet_rate = 50

[port_scan]
# Distinct ports on one host that one source tried to connect to (bare SYNs)
# and that never answered with a SYN-ACK. Replies to your own connections
# and answered connections (e.g. FTP passive mode) don't count.
# UDP scans aren't detected by this rule.
min_unique_ports = 20

[large_payload]
# Size in bytes of a single packet. Packets in an established TCP connection
# are ignored: the capturing computer merges them into oversized frames.
min_packet_size = 10000

[high_frequency]
# A flood of small packets outside an established TCP connection. All three
# conditions must hold, so large downloads and their ACKs don't trigger it.
# Packets per second within the flow.
min_packet_rate = 1000
# Average packet size in bytes; floods use small packets.
max_avg_packet_size = 300
# Fraction of packets that are TCP ACKs; established transfers are mostly ACKs.
max_ack_ratio = 0.5

[request_flood]
# One source opening completed TCP connections to one service (host and
# port), e.g. an HTTP flood. On CIC-IDS2017 the busiest normal traffic
# peaked at 251 in 10 seconds; the HTTP flood ran at around 800.
min_new_connections_10s = 400

[distributed_flood]
# Different internet hosts opening connections to one of your hosts within
# a minute. Raise it if you run a public server, or peer-to-peer software
# that accepts many incoming connections.
min_external_sources_60s = 50

[network_sweep]
# Different hosts on your network that one source contacted on the same port
# within a minute: how worms and scanners look for targets. Normal traffic on
# CIC-IDS2017 peaked at 7 (Windows name lookups).
min_local_hosts_60s = 20

[beaconing]
# A device on your network that keeps opening TCP connections to the same
# internet server and port throughout the last hour, the way malware checks
# in with its controller. On CIC-IDS2017 this caught all five infected
# machines within about 45 minutes.
#
# Off by default, because ordinary software does the same: on CIC-IDS2017's
# held-out Monday it flagged two workstations reconnecting to dozens of web
# services all day, and in 24 hours on a real laptop it flagged the Cursor
# editor and the Claude apps 50 times. Turn it on if you'd rather have noisy
# alerts than miss a bot; details in docs/evaluation.md.
enabled = false
# Check-ins (connections a few seconds apart count once) in the last hour.
min_checkins_per_hour = 30
# Of the hour's twelve 5-minute slots, how many had a check-in.
min_active_slots = 11
# It's an ongoing condition, so repeat the alert at most this often per
# device and server rather than every minute.
repeat_alert_seconds = 3600

[rate_evidence]
# Rate-based rules (syn_flood, high_frequency) wait until a flow has this
# much history. A single packet otherwise reads as 1000 packets/second.
min_packets = 10
min_duration_seconds = 0.1

[anomaly]
# The anomaly model judges each source -> destination flow at most this
# often. Judging every packet gives a busy connection hundreds of chances to
# trip a false alarm; on CIC-IDS2017 every 5 seconds caught the same attacks
# with about half the false alarms, and costs far less CPU. 0 judges every packet.
judge_interval_seconds = 5

[alerts]
# Repeats of the same threat for the same source -> destination pair are
# suppressed for this many seconds. The ALERT_COOLDOWN_SECONDS environment
# variable overrides this.
cooldown_seconds = 60

[names]
# Learn hostnames from DNS answers, cleartext HTTP Host headers and the TLS
# server name (SNI), and attach them to alerts as context (e.g.
# api2.cursor.sh next to an IP). Kept in memory only.
# Off by default: names are chosen by whoever sends the traffic, and
# enabling this means capture peeks at those fields. Also set
# PAYLOAD_INSPECTION=true in .env and restart capture.
enabled = false
# Max name mappings kept in the analyzer's memory. Each learned name takes
# two: one for the device that used it, one for the address alone.
max_entries = 10000
# Forget a mapping this many seconds after last seeing it (24 hours).
ttl_seconds = 86400

[limits]
# Hard caps on what the analyzer keeps in memory, so a flood of made-up
# addresses can't use it all up. When a table is full, the entry that has
# been quiet longest is dropped; flows, hosts, services and sweeps first
# drop entries seen only once, so a flood of made-up addresses can't push
# out real ones. The defaults sit far above anything seen on real traffic (a
# busy office network with a port scan peaked at about 45,000 connections)
# and use up to about 800 MB when every table is full; lower them on small
# devices such as a Raspberry Pi. Reaching a limit raises a
# RESOURCE_PRESSURE alert.
#
# One-way flows (source -> destination).
max_flows = 50000
# Two-way connections. A port scan creates one per port it tries.
max_connections = 200000
# Hosts with a new connection in the last minute.
max_hosts = 50000
# (source, destination, port) pairs counted for request floods.
max_services = 50000
# (source, port) pairs counted for network sweeps.
max_sweeps = 50000
# Connections remembered per host per window. Counts top out here, which is
# far above every rule threshold (the highest is 400).
max_window_events = 10000
# (device, server, port) series watched for regular check-ins.
max_beacon_series = 50000
# Alerts being held back from repeating (the cooldown above).
max_alert_cooldowns = 10000
# Flows the anomaly model has judged recently.
max_judged_flows = 50000

[retention]
# Old alerts are deleted so the database can't fill the disk. Alerts older
# than this many days go (checked hourly)...
max_age_days = 90
# ...and at most this many are kept, newest first (checked every minute), as a
# backstop for a flood of alerts. An alert takes about 1.5 KB with its
# indexes, so the default keeps the database to roughly 750 MB, plus at most a
# minute's worth of new alerts until the next check.
max_alerts = 500000
