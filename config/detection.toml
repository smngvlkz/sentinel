# SentinelAI detection thresholds.
#
# The defaults are tuned conservatively for a home or small-office network.
# Busy networks (file servers, streaming boxes) may need higher rate limits
# to avoid noise. Restart the analyzer after editing:
#
#     make restart
#
# Point SENTINEL_CONFIG at another file to keep your own copy outside the repo.

[syn_flood]
# Fraction of a flow's packets that are bare SYNs (connection attempts).
min_syn_ratio = 0.8
# Packets per second within the flow.
min_packet_rate = 50

[port_scan]
# Distinct ports on one host that one source tried to connect to (bare SYNs)
# and that never answered with a SYN-ACK. Replies to your own connections
# and answered connections (e.g. FTP passive mode) don't count.
# UDP scans aren't detected by this rule.
min_unique_ports = 20

[large_payload]
# Size in bytes of a single packet. Packets in an established TCP connection
# are ignored: the capturing computer merges them into oversized frames.
min_packet_size = 10000

[high_frequency]
# A flood of small packets outside an established TCP connection. All three
# conditions must hold, so large downloads and their ACKs don't trigger it.
# Packets per second within the flow.
min_packet_rate = 1000
# Average packet size in bytes; floods use small packets.
max_avg_packet_size = 300
# Fraction of packets that are TCP ACKs; established transfers are mostly ACKs.
max_ack_ratio = 0.5

[rate_evidence]
# Rate-based rules (syn_flood, high_frequency) wait until a flow has this
# much history. A single packet otherwise reads as 1000 packets/second.
min_packets = 10
min_duration_seconds = 0.1

[anomaly]
# The anomaly model judges each source -> destination flow at most this
# often. Judging every packet gives a busy connection hundreds of chances to
# trip a false alarm; on CIC-IDS2017 every 5 seconds caught the same attacks
# with about half the false alarms, and costs far less CPU. 0 judges every packet.
judge_interval_seconds = 5

[alerts]
# Repeats of the same threat for the same source -> destination pair are
# suppressed for this many seconds. The ALERT_COOLDOWN_SECONDS environment
# variable overrides this.
cooldown_seconds = 60
